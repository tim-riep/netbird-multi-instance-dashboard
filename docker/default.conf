server {
	listen 80 default_server;
	listen [::]:80 default_server;

    root /usr/share/nginx/html;

    # Hostnames without an instance file, when there is no default instance.
    if ($nb_instance = "") {
        return 404;
    }

    # Each hostname gets the config of its own instance (init_react_envs.sh).
    location ~ ^/(config\.json|OidcTrustedDomains\.js)$ {
        root /var/lib/netbird-dashboard/instances;
        try_files /$nb_instance/$1 =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $nb_csp always;
        expires off;
    }
    location = /netbird.wasm {
        root /usr/share/nginx/html;
        default_type application/wasm;
    }
    location = /ironrdp-pkg/ironrdp_web_bg.wasm {
        root /usr/share/nginx/html;
        default_type application/wasm;
    }

    location / {
      try_files $uri $uri.html $uri/ =404;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Content-Security-Policy $nb_csp always;
      add_header Last-Modified "";
      expires off;
   }

   error_page 404 /404.html;
   location = /404.html {
      internal;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header Content-Security-Policy $nb_csp always;
      add_header Last-Modified "";
      expires off;
   }
}