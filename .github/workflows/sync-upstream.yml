name: sync upstream
# Merges netbirdio/dashboard into main once a day and tags each new upstream
# release (see .github/scripts/sync-upstream.sh). The push starts
# fork-image.yml, so every merge and every release gets an image.
#
# Needs the secret SYNC_TOKEN: a fine-grained personal access token for this
# repository with "Contents" and "Workflows" read and write. GITHUB_TOKEN
# can't push merges that change upstream's workflow files, and its pushes
# don't start other workflows.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::error::The secret SYNC_TOKEN is missing, see the comment at the top of sync-upstream.yml."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/sync-upstream.sh
